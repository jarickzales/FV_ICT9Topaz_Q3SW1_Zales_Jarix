<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: burlywood;
        }
        kbd{
            font-size: 50px;
        }
        button{
            text-size: 50px;
        }
        
    </style>
</head>
<body>
    <center>
        <br><br><br><br><br><br><br><br>
    <h1>Convert Pesos into Other Currencies!</h1>
    <br><br>
    <h3>Input Pesos:</h3  >
        <kbd>100</kbd>
        <br>
        <br>
    <h3>Press the Buttons:</h3>
        <br>
        <br>

       <button type="button" class="btn btn-success btn-log" onclick="window.alert(usd)">US Dollar</button>
       <button type="button" class="btn btn-success btn-log" onclick="window.alert(jpy)">Japanese Yen</button>
    </center>









    <script>
        let usd = 1.71;   //conversion rate as of January 13, 11:49 AM
        let jpy = 268.66; //conversion rate as of January 13, 11:53 AM

        document.getElementById(usd).innerHTML = usd
        document.getElementById(jpy).innerHTML = jpy

    <button type="button" onclick="document.getElementById('display').innerHTML=3+4">Display</button>
    <button type="button" onclick="window.alert(3+4)">Try it</button>
    */
   </script>

</body>
</html>
